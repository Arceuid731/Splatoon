name: Package Preset Hub

on:
  push:
    branches: ["codex/preset-hub-v1"]
    paths:
      - "Splatoon/**"
      - "Splatoon.PresetHub.Core/**"
      - "Splatoon.PresetHub.Core.Tests/**"
      - "tools/PresetHubUiSmoke/**"
      - ".github/workflows/Package Preset Hub.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Download current Dalamud development files
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "dalamud.zip"
          $directory = Join-Path $env:RUNNER_TEMP "dalamud"
          Invoke-WebRequest "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile $archive
          Expand-Archive $archive -DestinationPath $directory
          "DALAMUD_PATH=$directory" >> $env:GITHUB_ENV
      - name: Build plugin package
        shell: pwsh
        run: dotnet build Splatoon/Splatoon.csproj --configuration Release -p:Platform=x64 -p:DalamudLibPath="$env:DALAMUD_PATH/"
      - name: Test Preset Hub
        shell: pwsh
        run: dotnet test Splatoon.PresetHub.Core.Tests/Splatoon.PresetHub.Core.Tests.csproj --configuration Release
      - name: Render coverage tree with native ImGui
        shell: pwsh
        run: dotnet run --project tools/PresetHubUiSmoke --configuration Release -p:DalamudLibPath="$env:DALAMUD_PATH/"
      - name: Collect package
        id: package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $package = Get-ChildItem Splatoon/bin/Release -Recurse -Filter latest.zip | Select-Object -First 1
          if ($null -eq $package) { throw "DalamudPackager did not produce latest.zip" }
          [xml]$project = Get-Content Splatoon/Splatoon.csproj
          $version = ($project.Project.PropertyGroup | Where-Object Version | Select-Object -First 1).Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Missing plugin version" }
          Copy-Item $package.FullName "artifacts/Splatoon-PresetHub-$version.zip"
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v7
        with:
          name: Splatoon-PresetHub-${{ steps.package.outputs.version }}
          path: artifacts/Splatoon-PresetHub-${{ steps.package.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 14
